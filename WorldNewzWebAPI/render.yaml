services:
  - type: web
    name: worldnewz-webapi
    env: dotnet
    plan: free
    region: singapore
    buildCommand: "dotnet publish -c Release -o out"
    startCommand: "dotnet out/WorldNewzWebAPI.dll"
    envVars:
      - key: NEWS_API_KEY
        sync: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://worldnewzs.in,https://world-newz.vercel.app,https://ganeshkumargit12.github.io,http://localhost:5173,http://localhost:5174"
      - key: DATABASE_URL
        fromDatabase:
          name: worldnewz-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: true
      - key: GNEWS_API_KEY
        sync: true
      - key: WORLDNEWS_API_KEY
        sync: true
    healthCheckPath: "/health"

databases:
  - name: worldnewz-db
    databaseName: worldnewz
    user: worldnewz_user
    plan: free
    region: singapore