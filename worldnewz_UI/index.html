<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Preload main hero image/logo for LCP optimization -->
  <link rel="preload" href="/logo-transparent.svg" as="image" type="image/svg+xml" fetchpriority="high" />
  
  <meta name="description"
    content="WorldNewzs – Stay updated with the latest news in sports, business, technology, health, and more." />
  <meta name="keywords"
    content="news, breaking news, latest news, sports news, business news, technology news, health news, world news, daily news, WorldNewzs" />
  <meta property="og:title" content="WorldNewzs – Your World, Your News" />
  <meta property="og:description"
    content="Stay updated with the latest news in sports, business, technology, health, and more." />
  <meta property="og:image" content="https://worldnewzs.in/favicon.svg" />
  <meta property="og:url" content="https://worldnewzs.in" />
  <meta property="og:type" content="website" />
  <meta name="google-adsense-account" content="ca-pub-7547748414764075" />
  <meta name="facebook-domain-verification" content="9k75v6j7w1wg41u2dmd14zuihaw74p" />
  <title>WorldNewzs – Your World, Your News</title>
  
  <!-- Redirect from Vercel app domain to production domain -->
  <script src="/scripts/redirect.js"></script>
  
  <!-- Optimized Google Fonts loading (Non-render blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  </noscript>

  <!-- Optimized Dynamic Script Loader for Trackers and Ads (Post-Load & Idle Execution) -->
  <script src="/scripts/thirdparty.js" defer></script>
</head>

<body>
  <div id="root">
    <!-- Premium Pre-render Loading Screen (Inlined Critical CSS to eliminate CLS and FCP latency) -->
    <div id="initial-loader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0d1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      z-index: 999999;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    ">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <!-- Logo Wrapper with subtle pulse -->
        <div style="
          width: 80px;
          height: 80px;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.05);
          display: flex;
          justify-content: center;
          align-items: center;
          border: 1px solid rgba(255, 255, 255, 0.1);
          animation: pulse-glow 2s infinite ease-in-out;
        ">
          <img src="/logo-transparent.svg" alt="Logo" style="width: 50px; height: 50px;" />
        </div>
        <!-- Glowing title -->
        <h1 style="
          font-size: 1.5rem;
          font-weight: 800;
          letter-spacing: 3px;
          margin: 0;
          text-transform: uppercase;
          background: linear-gradient(135deg, #ff8a65, #c83a15);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        ">WorldNewzs</h1>
        <!-- Modern Spinner -->
        <div style="
          width: 24px;
          height: 24px;
          border: 2px solid rgba(255, 255, 255, 0.1);
          border-top: 2px solid #ff8a65;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        "></div>
      </div>
      
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse-glow {
          0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 138, 101, 0.2); }
          50% { transform: scale(1.05); box-shadow: 0 0 20px 4px rgba(255, 138, 101, 0.4); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
