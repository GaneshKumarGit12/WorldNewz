<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
      }

      .placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 16px;
        box-sizing: border-box;
        color: #64748b;
        text-align: center;
        background: linear-gradient(135deg, rgba(248, 250, 252, 0.95), rgba(226, 232, 240, 0.9));
        border-radius: 10px;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #475569;
      }

      .title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #0f172a;
      }

      .detail {
        font-size: 0.8rem;
        line-height: 1.4;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="placeholder">
      <div class="badge">Sponsored</div>
      <div class="title">Ad space available</div>
      <div class="detail">The third-party ad provider is temporarily unavailable, so this slot is showing a local placeholder.</div>
    </div>
  </body>
</html>
