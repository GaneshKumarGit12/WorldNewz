<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background circle/square -->
  <rect width="500" height="500" rx="100" fill="#c83a15" />
  
  <!-- Outer Orbit & Grid Lines -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Half Globe Outline -->
    <path d="M 120 250 A 130 130 0 0 1 380 250" />
    
    <!-- Top Half Continents (simplified outlines matching reference) -->
    <path d="M 150 250 L 165 215 L 180 225 L 210 185 L 235 205 L 255 175 L 285 215 L 310 195 L 335 215 L 350 175 L 365 205 L 375 250" />
    <path d="M 230 150 Q 250 130 270 140 L 280 160 Z" />
    
    <!-- Bottom Half Globe Outline -->
    <path d="M 120 250 A 130 130 0 0 0 380 250" />
    
    <!-- Bottom Half Latitude/Longitude Lines -->
    <!-- Meridians -->
    <path d="M 250 250 L 250 380" />
    <path d="M 200 250 Q 230 330 250 380" /> <!-- left meridian -->
    <path d="M 300 250 Q 270 330 250 380" /> <!-- right meridian -->
    
    <!-- Parallel (latitude lines) -->
    <path d="M 140 300 Q 250 330 360 300" />
    <path d="M 175 340 Q 250 360 325 340" />

    <!-- Swoosh Orbits (Ellipses/Sweeping paths) -->
    <!-- Top Swoosh (swooping from center-left, wrapping around top-right) -->
    <path d="M 225 240 C 270 180 340 100 405 100 C 420 100 410 140 370 190 C 340 230 300 250 225 240 Z" fill="#ffffff" stroke="none" />
    
    <!-- Bottom Swoosh (swooping from center-right, wrapping around bottom-left) -->
    <path d="M 275 260 C 230 320 160 400 95 400 C 80 400 90 360 130 310 C 160 270 200 250 275 260 Z" fill="#ffffff" stroke="none" />
  </g>
  
  <!-- Central Text "WORLDNEWZS" -->
  <rect x="100" y="225" width="300" height="50" fill="#c83a15" />
  <text x="250" y="260" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Outfit', 'Roboto', sans-serif" font-weight="900" font-size="34" letter-spacing="3.5">WORLDNEWZS</text>
</svg>
